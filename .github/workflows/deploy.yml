name: Deploy to GitHub Pages

on:
  push:
    branches: [arena/1e1601e3-threejsgame, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          grep -q "<script" dist/index.html || (echo "dist/index.html has no script tag" && exit 1)
          echo "dist OK:" && ls -la dist

      - uses: actions/configure-pages@v5
        with:
          # Repo Pages kapalıysa workflow token'ı (pages: write) ile otomatik aç
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
